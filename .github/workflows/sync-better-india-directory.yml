name: Sync Better India Directory

on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: Who requested this sync
        required: false
        type: string
        default: admin
  schedule:
    - cron: "30 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Better India sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BETTER_INDIA_REQUESTED_BY: ${{ inputs.requested_by || 'scheduled' }}
        run: npm run sync:better-india
