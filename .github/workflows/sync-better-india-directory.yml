name: Sync Better India Directory

on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: Who requested this sync
        required: false
        type: string
        default: admin
  schedule:
    - cron: "30 */6 * * *"

concurrency:
  group: better-india-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Better India sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BETTER_INDIA_REQUESTED_BY: ${{ inputs.requested_by || 'scheduled' }}
          GEMINI_REQUEST_DELAY_MS: 750
          BETTER_INDIA_STALE_RUN_MINUTES: 10
          BETTER_INDIA_HTTP_TIMEOUT_MS: 30000
          BETTER_INDIA_GEMINI_TIMEOUT_MS: 45000
          BETTER_INDIA_RUN_TIMEOUT_MS: 600000
          BETTER_INDIA_DEEPSEEK_SWITCH_MS: 300000
        run: npm run sync:better-india
